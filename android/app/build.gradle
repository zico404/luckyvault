plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
}

// Load keystore properties for release signing (CI creates this from GitHub Secrets)
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.luckyvault'
    compileSdk 34

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.luckyvault"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        multiDexEnabled true

        // Supabase configuration (safe to expose — anon key only)
        buildConfigField "String", "SUPABASE_URL", '"https://kiogfskwxjgjbjqnwdyh.supabase.co"'
        buildConfigField "String", "SUPABASE_ANON_KEY", '"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtpb2dmc2t3eGpnamJqcW53ZHloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjUwMDAwMDAsImV4cCI6MjA0MDU3NjAwMH0.DummyKeyReplaceWithRealSupabaseAnonKey"'

        // Backend API (for server-side operations)
        buildConfigField "String", "API_BASE_URL", '"https://api.luckyvault.app/api/v1/"'
    }

    buildTypes {
        debug {
            // Local development — backend runs on localhost
            buildConfigField "String", "API_BASE_URL", '"http://10.0.2.2:3000/api/v1/"'
            buildConfigField "String", "SUPABASE_URL", '"https://kiogfskwxjgjbjqnwdyh.supabase.co"'
            buildConfigField "Boolean", "IS_DEBUG", "true"
        }
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            buildConfigField "String", "API_BASE_URL", '"https://api.luckyvault.app/api/v1/"'
            buildConfigField "String", "SUPABASE_URL", '"https://kiogfskwxjgjbjqnwdyh.supabase.co"'
            buildConfigField "Boolean", "IS_DEBUG", "false"
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.5'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.animation:animation'

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.navigation:navigation-compose:2.7.5'

    // Hilt
    implementation 'com.google.dagger:hilt-android:2.50'
    kapt 'com.google.dagger:hilt-compiler:2.50'
    implementation 'androidx.hilt:hilt-navigation-compose:1.1.0'

    // Supabase Kotlin SDK
    implementation 'io.github.jan-tennert.supabase:postgrest-kt:2.4.1'
    implementation 'io.github.jan-tennert.supabase:gotrue-kt:2.4.1'
    implementation 'io.github.jan-tennert.supabase:realtime-kt:2.4.1'

    // Retrofit (for backend API calls)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // DataStore (for secure token storage)
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // Splash Screen
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // QR Code
    implementation 'com.google.zxing:core:3.5.3'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
