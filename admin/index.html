<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Vault Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a0a; color: #e0e0e0; min-height: 100vh; }
        .header { background: #1a1a2e; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .header h1 { color: #ffd700; font-size: 20px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        .login-form { max-width: 400px; margin: 80px auto; background: #1a1a2e; padding: 32px; border-radius: 12px; }
        .login-form h2 { color: #ffd700; margin-bottom: 24px; text-align: center; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 12px; color: #999; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; background: #0a0a0a; border: 1px solid #333; border-radius: 8px; color: #e0e0e0; font-size: 14px; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #ffd700; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; }
        .btn-primary { background: #1b5e20; color: white; }
        .btn-primary:hover { background: #2e7d32; }
        .btn-gold { background: #ffd700; color: #0a0a0a; }
        .btn-gold:hover { background: #ffed4a; }
        .btn-danger { background: #c62828; color: white; }
        .btn-danger:hover { background: #e53935; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .card { background: #1a1a2e; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
        .card h3 { color: #ffd700; margin-bottom: 12px; font-size: 16px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: #1a1a2e; padding: 20px; border-radius: 12px; border-left: 3px solid #ffd700; }
        .stat-card .value { font-size: 28px; font-weight: bold; color: #ffd700; }
        .stat-card .label { font-size: 12px; color: #999; margin-top: 4px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #222; font-size: 13px; }
        th { color: #999; font-weight: 600; font-size: 11px; text-transform: uppercase; }
        .badge { padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge-open { background: #1b5e2020; color: #00c853; }
        .badge-completed { background: #ffd70020; color: #ffd700; }
        .badge-won { background: #00c85320; color: #00c853; }
        .badge-lost { background: #33333320; color: #999; }
        .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
        .tab { padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; background: #1a1a2e; color: #999; border: 1px solid #333; }
        .tab.active { background: #1b5e20; color: white; border-color: #1b5e20; }
        .hidden { display: none; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: #1a1a2e; padding: 24px; border-radius: 12px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .flex { display: flex; gap: 8px; align-items: center; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        #app { display: none; }
    </style>
</head>
<body>
    <div id="loginPage">
        <div class="login-form">
            <h2>Lucky Vault Admin</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="admin@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Password">
            </div>
            <button class="btn btn-primary" style="width:100%" onclick="login()">Sign In</button>
            <p id="loginError" style="color:#cf6679;text-align:center;margin-top:12px;font-size:13px"></p>
        </div>
    </div>

    <div id="app">
        <div class="header">
            <h1>Lucky Vault Admin</h1>
            <div class="flex">
                <span id="adminEmail" style="font-size:13px;color:#999"></span>
                <button class="btn btn-danger btn-sm" onclick="logout()">Sign Out</button>
            </div>
        </div>

        <div class="container">
            <div class="tabs">
                <div class="tab active" onclick="showTab('dashboard')">Dashboard</div>
                <div class="tab" onclick="showTab('draws')">Draws</div>
                <div class="tab" onclick="showTab('users')">Users</div>
                <div class="tab" onclick="showTab('audit')">Audit Logs</div>
            </div>

            <!-- Dashboard -->
            <div id="tab-dashboard">
                <div class="grid">
                    <div class="stat-card"><div class="value" id="stat-users">-</div><div class="label">Total Users</div></div>
                    <div class="stat-card"><div class="value" id="stat-draws">-</div><div class="label">Active Draws</div></div>
                    <div class="stat-card"><div class="value" id="stat-tickets">-</div><div class="label">Tickets Sold</div></div>
                    <div class="stat-card"><div class="value" id="stat-revenue">-</div><div class="label">Total Revenue</div></div>
                </div>
            </div>

            <!-- Draws -->
            <div id="tab-draws" class="hidden">
                <div class="flex-between" style="margin-bottom:16px">
                    <h2 style="color:#ffd700;font-size:18px">Draw Management</h2>
                    <button class="btn btn-gold" onclick="showCreateDrawModal()">+ Create Draw</button>
                </div>
                <div class="card">
                    <table>
                        <thead><tr><th>Title</th><th>Price</th><th>Tickets</th><th>Prize Pool</th><th>Status</th><th>Actions</th></tr></thead>
                        <tbody id="drawsTable"></tbody>
                    </table>
                </div>
            </div>

            <!-- Users -->
            <div id="tab-users" class="hidden">
                <h2 style="color:#ffd700;font-size:18px;margin-bottom:16px">User Management</h2>
                <div class="card">
                    <table>
                        <thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Status</th><th>Joined</th></tr></thead>
                        <tbody id="usersTable"></tbody>
                    </table>
                </div>
            </div>

            <!-- Audit Logs -->
            <div id="tab-audit" class="hidden">
                <h2 style="color:#ffd700;font-size:18px;margin-bottom:16px">Audit Logs</h2>
                <div class="card">
                    <table>
                        <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead>
                        <tbody id="auditTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Draw Modal -->
    <div id="createDrawModal" class="modal hidden" onclick="if(event.target===this)closeModal()">
        <div class="modal-content">
            <h3 style="color:#ffd700;margin-bottom:16px">Create New Draw</h3>
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="drawTitle" placeholder="e.g. Weekly Jackpot">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="drawDesc" rows="2" placeholder="Optional description"></textarea>
            </div>
            <div class="form-group">
                <label>Ticket Price ($)</label>
                <input type="number" id="drawPrice" min="1" value="10">
            </div>
            <div class="form-group">
                <label>Max Tickets</label>
                <input type="number" id="drawMaxTickets" min="1" value="100">
            </div>
            <div class="form-group">
                <label>Winner Count</label>
                <input type="number" id="drawWinnerCount" min="1" value="1">
            </div>
            <div class="form-group">
                <label>Scheduled At</label>
                <input type="datetime-local" id="drawScheduledAt">
            </div>
            <div class="flex" style="margin-top:16px;justify-content:flex-end">
                <button class="btn btn-danger btn-sm" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="createDraw()">Create</button>
            </div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:3000/api/v1';
        let token = localStorage.getItem('admin_token');

        async function api(path, method = 'GET', body = null) {
            const opts = { method, headers: { 'Content-Type': 'application/json' } };
            if (token) opts.headers['Authorization'] = `Bearer ${token}`;
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch(`${API}${path}`, opts);
            return res.json();
        }

        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            try {
                const res = await api('/auth/login', 'POST', { email, password });
                if (res.success && res.data.user.role === 'ADMIN') {
                    token = res.data.accessToken;
                    localStorage.setItem('admin_token', token);
                    document.getElementById('loginPage').style.display = 'none';
                    document.getElementById('app').style.display = 'block';
                    document.getElementById('adminEmail').textContent = res.data.user.email;
                    loadDashboard();
                } else {
                    document.getElementById('loginError').textContent = res.message || 'Invalid credentials or not an admin';
                }
            } catch (e) {
                document.getElementById('loginError').textContent = 'Connection error';
            }
        }

        function logout() {
            token = null;
            localStorage.removeItem('admin_token');
            document.getElementById('app').style.display = 'none';
            document.getElementById('loginPage').style.display = 'block';
        }

        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('[id^="tab-"]').forEach(t => t.classList.add('hidden'));
            event.target.classList.add('active');
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            if (tab === 'draws') loadDraws();
            if (tab === 'users') loadUsers();
            if (tab === 'audit') loadAuditLogs();
        }

        async function loadDashboard() {
            const draws = await api('/draws/active');
            document.getElementById('stat-draws').textContent = draws.data?.length || 0;
            const users = await api('/admin/users');
            document.getElementById('stat-users').textContent = users.data?.total || 0;
        }

        async function loadDraws() {
            const res = await api('/draws/active');
            const draws = res.data || [];
            let html = '';
            for (const d of draws) {
                const statusClass = d.status === 'OPEN' ? 'badge-open' : 'badge-completed';
                html += `<tr>
                    <td>${d.title}</td>
                    <td>$${d.ticketPrice}</td>
                    <td>${d.soldTickets}/${d.maxTickets}</td>
                    <td>$${d.prizePool}</td>
                    <td><span class="badge ${statusClass}">${d.status}</span></td>
                    <td>
                        ${d.status === 'UPCOMING' ? `<button class="btn btn-primary btn-sm" onclick="openDraw('${d.id}')">Open</button>` : ''}
                        ${d.status === 'OPEN' ? `<button class="btn btn-gold btn-sm" onclick="executeDraw('${d.id}')">Execute</button>` : ''}
                    </td>
                </tr>`;
            }
            document.getElementById('drawsTable').innerHTML = html || '<tr><td colspan="6" style="text-align:center;color:#999">No draws found</td></tr>';
        }

        async function openDraw(id) {
            await api(`/draws/${id}/open`, 'PATCH');
            loadDraws();
        }

        async function executeDraw(id) {
            if (!confirm('Execute this draw? This cannot be undone.')) return;
            const res = await api(`/draws/${id}/execute`, 'POST');
            alert(res.message || 'Draw executed');
            loadDraws();
        }

        async function loadUsers() {
            const res = await api('/admin/users');
            const users = res.data?.users || [];
            let html = '';
            for (const u of users) {
                html += `<tr>
                    <td>${u.email}</td>
                    <td>${u.displayName || '-'}</td>
                    <td>${u.role}</td>
                    <td>${u.isActive ? '<span class="badge badge-open">Active</span>' : '<span class="badge badge-lost">Inactive</span>'}</td>
                    <td>${u.createdAt?.substring(0, 10)}</td>
                </tr>`;
            }
            document.getElementById('usersTable').innerHTML = html || '<tr><td colspan="5" style="text-align:center;color:#999">No users found</td></tr>';
        }

        async function loadAuditLogs() {
            const res = await api('/admin/audit-logs');
            const logs = res.data?.logs || [];
            let html = '';
            for (const l of logs) {
                html += `<tr>
                    <td>${l.createdAt?.substring(0, 16).replace('T', ' ')}</td>
                    <td>${l.user?.email || 'System'}</td>
                    <td>${l.action}</td>
                    <td>${l.entity}</td>
                    <td>${l.entityId || '-'}</td>
                </tr>`;
            }
            document.getElementById('auditTable').innerHTML = html || '<tr><td colspan="5" style="text-align:center;color:#999">No logs found</td></tr>';
        }

        function showCreateDrawModal() {
            document.getElementById('createDrawModal').classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('createDrawModal').classList.add('hidden');
        }

        async function createDraw() {
            const data = {
                title: document.getElementById('drawTitle').value,
                description: document.getElementById('drawDesc').value || undefined,
                ticketPrice: parseFloat(document.getElementById('drawPrice').value),
                maxTickets: parseInt(document.getElementById('drawMaxTickets').value),
                winnerCount: parseInt(document.getElementById('drawWinnerCount').value),
                scheduledAt: document.getElementById('drawScheduledAt').value || new Date().toISOString()
            };
            await api('/admin/draws', 'POST', data);
            closeModal();
            loadDraws();
        }

        // Auto-login if token exists
        if (token) {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            loadDashboard();
        }
    </script>
</body>
</html>
