# Lucky Vault Android CI/CD
# Builds Debug APK, Release APK, and Android App Bundle (AAB)
# Triggered on push/PR to main branch

name: Android CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_COMPILE_SDK: 34
  ANDROID_BUILD_TOOLS: 34.0.0
  ANDROID_NDK_VERSION: 25.2.9519653
  JAVA_VERSION: 17

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Run lint
        run: ./gradlew lint --no-daemon

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: android/app/build/reports/lint-results-*.html
          retention-days: 7

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: android/app/build/reports/tests/
          retention-days: 7

  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          accept-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Sign debug APK (debug keystore)
        if: success()
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/lucky-vault-debug.apk

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lucky-vault-debug-apk
          path: android/app/build/outputs/apk/debug/lucky-vault-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Copy Debug APK to apks/ with version
        if: success()
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_SRC" ]; then
            mkdir -p "${{ github.workspace }}/apks"
            cp "$APK_SRC" "${{ github.workspace }}/apks/LuckyVault-v${VERSION}-debug.apk"
            echo "Copied debug APK to apks/LuckyVault-v${VERSION}-debug.apk"
          fi

  build-release:
    name: Build Release APK & AAB
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: ./android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          accept-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
          else
            echo "Warning: KEYSTORE_BASE64 not set. Release signing will not be configured."
          fi

      - name: Create keystore properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "keystore.properties created"
          else
            echo "Warning: Keystore secrets not fully configured. Skipping keystore.properties creation."
          fi

      - name: Build release APK
        run: |
          if [ -f keystore.properties ]; then
            ./gradlew assembleRelease --no-daemon
          else
            echo "No keystore configured. Building release without signing (unsigned APK only)."
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Build Android App Bundle (AAB)
        run: |
          if [ -f keystore.properties ]; then
            ./gradlew bundleRelease --no-daemon
          fi

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lucky-vault-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 90
          if-no-files-found: warn

      - name: Upload Release AAB
        if: success() && hashFiles('android/app/build/outputs/bundle/release/app-release.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lucky-vault-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
          if-no-files-found: warn

      - name: Copy APK to apks/ with version
        if: success()
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          APK_SRC="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$APK_SRC" ]; then
            APK_SRC="app/build/outputs/apk/release/app-release.apk"
          fi
          if [ -f "$APK_SRC" ]; then
            mkdir -p "${{ github.workspace }}/apks"
            cp "$APK_SRC" "${{ github.workspace }}/apks/LuckyVault-v${VERSION}.apk"
            echo "Copied APK to apks/LuckyVault-v${VERSION}.apk"
          else
            echo "No release APK found, skipping copy"
          fi

      - name: Commit APK to repo
        if: success()
        run: |
          cd "${{ github.workspace }}"
          VERSION=$(grep 'versionName' android/app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          APK_FILE="apks/LuckyVault-v${VERSION}.apk"
          if [ -f "$APK_FILE" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$APK_FILE"
            if git diff --cached --quiet; then
              echo "No changes to commit"
            else
              git commit -m "chore: update APK v${VERSION} [skip ci]"
              git push
            fi
          fi

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [lint, test, build-debug, build-release]
    if: always()
    steps:
      - name: Display build status
        run: |
          echo "## Lucky Vault Android Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Debug APK | ${{ needs.build-debug.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release APK/AAB | ${{ needs.build-release.result }} |" >> $GITHUB_STEP_SUMMARY
